[project]
name = "backup-monitor"
version = "1.0.0"
description = "Daily freshness check for a k3s cluster's Longhorn backups and etcd snapshots on Oracle Cloud"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "apprise-notify @ git+https://github.com/mbologna/apprise-notify-py@v1.0.0",
    "oci>=2.160.0",
]

[project.scripts]
backup-monitor = "backup_monitor:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-cov>=7.1.0", "ruff>=0.8.0"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["backup_monitor"]
